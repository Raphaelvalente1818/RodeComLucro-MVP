<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem isso o iPhone ignora env(safe-area-inset-*)
         e a barra de abas ficaria colada na barra de gesto (08/10). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E0D" />
    <title>Rode com Lucro</title>
    <!--
      Ícone da tela de início (01/10, pedido do Raphael): o mesmo logo do
      login, em public/icons. iPhone usa só o apple-touch-icon (180px,
      quadrado — o iOS arredonda); Android/Chrome lê o manifest (192/512 +
      maskable com zona segura central). Arquivos gerados a partir de
      public/img/logo-rode-com-lucro.jpg; regerar se o logo mudar.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Rode com Lucro" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Barlow (Jeremy Tribby): grotesca desenhada a partir da sinalização
      pública da Califórnia — placas de rodovia e de carro. Escolhida de
      propósito pro app de quem vive na estrada. A Condensed entra só nas
      etiquetas em caixa alta (eyebrow, veredito, selos).

      display=swap: a tela renderiza na hora com a fonte do sistema e
      troca quando a Barlow chega — sem tela em branco em rede de posto,
      que é o cenário do PRD (LCP < 2,5s em 4G). TODO: hospedar os .woff2
      no próprio projeto (public/fontes) pra funcionar offline no PWA e
      não depender do Google — pendente do ambiente de build voltar.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
